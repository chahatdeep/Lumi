<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Source for site/og-card.png (1200x630 link-preview image). Render with: npm run card -->
<style>
  @font-face { font-family: Card; src: local("Segoe UI Variable Display"), local("Segoe UI"); font-weight: 400 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #f4efe9;
    background:
      radial-gradient(700px 520px at 880px 300px, rgba(255, 160, 80, .30), transparent 65%),
      radial-gradient(600px 500px at 0 640px, rgba(160, 80, 160, .16), transparent 60%),
      #0d0b10;
    display: grid; grid-template-columns: 560px 1fr; align-items: center; padding: 0 64px 0 72px; box-sizing: border-box;
  }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 700; }
  .brand img { width: 64px; height: 64px; }
  h1 { font-size: 92px; line-height: 1; margin: 44px 0 26px; font-weight: 800; letter-spacing: -2px; }
  h1 span { background: linear-gradient(120deg, #fff1cf, #ffb547 45%, #ff7a3d); -webkit-background-clip: text; color: transparent; }
  p { font-size: 28px; line-height: 1.35; color: #c9bfc9; margin: 0; }
  .pills { display: flex; gap: 12px; margin-top: 34px; }
  .pills b { font-size: 21px; font-weight: 600; padding: 9px 18px; border-radius: 999px; border: 1px solid #3a3040; background: rgba(255,255,255,.04); color: #ffd79a; }
  .frame { justify-self: end; padding: 16px; border-radius: 30px; background: linear-gradient(145deg, #2a2330, #141118);
    box-shadow: 0 0 120px rgba(255, 180, 100, .45), 0 30px 80px rgba(0,0,0,.6); transform: rotate(2deg); }
  canvas { display: block; width: 480px; height: 360px; border-radius: 16px; }
</style>
</head>
<body>
  <div>
    <div class="brand"><img src="icon.png" alt="">Lumi</div>
    <h1>Photos that <span>glow.</span></h1>
    <p>Turn any photo into a 3D-printable lithophane, free in your browser.</p>
    <div class="pills"><b>Lithophanes</b><b>STL · 3MF</b><b>Nothing uploaded</b></div>
  </div>
  <div class="frame"><canvas id="c" width="960" height="720"></canvas></div>
  <script type="module">
    import { demoImage } from '../src/imageproc.js';
    // same backlit model as the website hero (site/site.js), lamp fully on
    const cv = document.getElementById('c'), W = cv.width, H = cv.height, g = cv.getContext('2d');
    g.drawImage(demoImage(), 0, 0, W, H);
    const im = g.getImageData(0, 0, W, H), d = im.data;
    for (let i = 0; i < W * H; i++) {
      const L = (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) / 255;
      const glow = Math.pow(Math.exp(-1.35 * (1 - L) * 2.4), 0.9), T = Math.exp(-1.35 * (1 - L) * 2.4);
      d[i * 4] = 255 * Math.min(1, glow * 1.08 + 0.03); d[i * 4 + 1] = 226 * glow + 10 * T * T; d[i * 4 + 2] = 168 * glow * glow + 6;
    }
    g.putImageData(im, 0, 0);
    document.title = 'ready';
  </script>
</body>
</html>
